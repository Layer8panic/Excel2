<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel 365 Academy – Livello 3 Avanzato</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#185abd;--blue-d:#103f91;--blue-l:#d6e6f8;--accent:#185abd;
  --frame:#f3f3f3;--card:#ffffff;--line:#e1e1e1;--hover:#ebebeb;--press:#dcdcdc;--on:#d6d6d6;--on-h:#c9c9c9;--txt:#242424;--mut:#616161;
  --canvas:#e9e9e9;--ui:'Segoe UI','Segoe UI Variable Text','Selawik','Noto Sans','Helvetica Neue',Arial,sans-serif;
  --body:'Aptos','Noto Sans','Segoe UI',Arial,sans-serif;--head:'Aptos Display','Aptos','Noto Sans','Segoe UI',Arial,sans-serif;
  --h1c:#0f4761;--h3c:#0f4761;--rib:var(--frame);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--frame);color:var(--txt);font:12px var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh}
svg.ic{width:20px;height:20px;fill:none;stroke:#424242;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
svg.ic.l{width:32px;height:32px;stroke-width:1.05}
svg.ic.s{width:16px;height:16px}
.ic .f{fill:#424242;stroke:none}.ic .fb{fill:#2b7cd3;stroke:none}.ic .sb{stroke:#185abd}.ic .fw{fill:#fff}.ic .fy{fill:#ffd23f;stroke:#c9a100}
.ic .fr{fill:#d13438;stroke:none}.ic .fg{fill:#107c41;stroke:none}.ic .sg{stroke:#107c41}.ic .so{stroke:#d9691f}.ic .fo{fill:#f0883e;stroke:none}
.ic .sr{stroke:#d13438}.ic .fl{fill:#e3eefb;stroke:#2b6cc4}.ic .fgy{fill:#e9e9e9;stroke:#8a8a8a}.ic .fgl{fill:#dff3e7;stroke:#107c41}
.ic .fol{fill:#fde9d9;stroke:#d9691f}.ic text{font:700 16px 'Segoe UI','Noto Sans',Arial,sans-serif;text-anchor:middle;fill:#333;stroke:none}
.ic text.sm{font-size:9px}.ic .bar{stroke:none}

/* ---------- Barra del titolo ---------- */
#title{background:var(--blue);color:#fff;height:40px;display:flex;align-items:center;padding:0 8px 0 4px;gap:4px;flex:none;user-select:none;position:relative}
#title .logo{width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:0}
#title .logo:hover{background:rgba(255,255,255,.14)}
#title .logo svg .f{fill:#fff}
#title .appname{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;padding:0 6px 0 8px}
#title .tb{background:none;border:0;color:#fff;width:32px;height:32px;border-radius:4px;display:grid;place-items:center}
#title .tb:hover{background:rgba(255,255,255,.16)}#title .tb:active{background:rgba(255,255,255,.26)}
#title .tb svg.ic{stroke:#fff;width:18px;height:18px}#title .tb svg .f{fill:#fff}
#title .tb svg .fl,#title .tb svg .fw,#title .tb svg .fgy{fill:transparent;stroke:#fff}
#title .tb.dis{opacity:.45;pointer-events:none}
#title .sep{width:1px;height:20px;background:rgba(255,255,255,.28);margin:0 4px}
#title .qat{width:22px}#title .qat svg.ic{width:14px;height:14px}
#title .appsuf{color:#fff;font-size:12.5px;white-space:nowrap;margin:0 6px 0 -2px;opacity:.95}
#title .winctl{display:flex;align-self:stretch;margin:0 -8px 0 6px}#title .winctl button{width:46px;border:0;background:none;display:grid;place-items:center;color:#fff}#title .winctl button:hover{background:rgba(255,255,255,.16)}#title .winctl button.cl:hover{background:#c42b1c}#title .winctl svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:1}
@media (max-width:1000px){#title .winctl,#title .appsuf{display:none}}
.as{display:flex;align-items:center;gap:7px;background:none;border:0;color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap}
.as:hover{background:rgba(255,255,255,.14)}
.as i{width:30px;height:15px;border-radius:8px;border:1px solid #fff;position:relative;transition:.15s}
.as i::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:#fff;transition:.15s}
.as.on i{background:#fff}.as.on i::after{left:17px;background:var(--blue)}
.as b{font-weight:400;opacity:.9;min-width:20px;text-align:left}
.dnwrap{display:flex;align-items:center;gap:2px;min-width:0}
#docname{background:transparent;border:1px solid transparent;color:#fff;font-weight:600;font-size:13px;padding:3px 6px;border-radius:4px;width:auto;max-width:260px;outline:0;text-overflow:ellipsis}
#docname:hover{background:rgba(255,255,255,.14)}#docname:focus{background:#fff;color:#222}
#savestate{font-size:12px;opacity:.92;display:flex;align-items:center;gap:6px;white-space:nowrap}
#savestate i{width:4px;height:4px;border-radius:50%;background:#fff;display:inline-block;opacity:.8}
#savestate.unsaved{opacity:1}#savestate.unsaved i{background:#ffc83d;width:7px;height:7px;opacity:1}
#search{flex:1;max-width:480px;min-width:160px;margin:0 auto;position:relative}
#search input{width:100%;height:30px;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,.9);color:#242424;padding:0 10px 0 32px;outline:0;font-size:13px}
#search input::placeholder{color:#616161}#search input:hover{background:#fff}#search input:focus{background:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
#search svg{position:absolute;left:10px;top:7px;stroke:#424242;width:16px;height:16px}
#searchres{position:absolute;top:34px;left:0;right:0;background:#fff;color:#242424;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:200;max-height:340px;overflow:auto;display:none;padding:4px}
#searchres .sh{padding:6px 10px 4px;color:#616161;font-size:11px;font-weight:600}
#searchres div.it{padding:7px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:4px}#searchres div.it:hover,#searchres div.it.sel{background:#f0f0f0}
#searchres small{color:#757575;margin-left:auto}
#title .right{display:flex;align-items:center;gap:6px;margin-left:8px}
#user{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 10px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}
#user:hover{background:rgba(255,255,255,.14)}
#user b{width:28px;height:28px;border-radius:50%;background:#c19c00;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
#academyBtn{background:#ffb900;color:#3b2a00;border:0;border-radius:4px;padding:5px 12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
#academyBtn:hover{background:#ffc83d}#academyBtn svg *{stroke:#3b2a00!important;fill:none!important}

/* ---------- Schede ---------- */
#tabs{background:var(--frame);display:flex;align-items:center;padding:0 8px;height:38px;flex:none;user-select:none;overflow:hidden;gap:0}
.tab{color:#424242;padding:0 10px;height:32px;display:flex;align-items:center;font-size:13px;cursor:pointer;border-radius:4px;position:relative;white-space:nowrap}
.tab span{display:inline-flex;flex-direction:column;align-items:center}
.tab span::after{content:attr(data-l);font-weight:600;height:0;visibility:hidden;overflow:hidden}
.tab:hover{background:#e6e6e6;color:#242424}
.tab.active{color:var(--blue);font-weight:600}
.tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:3px;border-radius:2px;background:var(--blue)}
.tab.ctx{color:#7719aa}.tab.ctx.active{color:#7719aa}.tab.ctx.active::after{background:#7719aa}.tab.ctx:hover{background:#f1e6f8}.tab.ctx:first-of-type{margin-left:6px}
.tab.ctx::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:1px;background:#d0d0d0}
.tab.ctx+.tab.ctx::before{display:none}
#tabright{margin-left:auto;display:flex;align-items:center;gap:6px;padding-left:10px}
.tbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:4px;border:1px solid #d1d1d1;background:#fff;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:#f5f5f5;border-color:#c7c7c7}
.tbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.tbtn.pri:hover{background:var(--blue-d)}
.tbtn.pri svg *{stroke:#fff!important}
#ribtoggle{background:none;border:0;width:30px;height:30px;border-radius:4px;display:grid;place-items:center}#ribtoggle:hover{background:#e6e6e6}
#ribtoggle svg{width:14px;height:14px}

/* ---------- Barra multifunzione ---------- */
#ribbon{background:var(--frame);height:110px;padding:0 8px 8px;flex:none;overflow:hidden;position:relative;z-index:30}
#ribbon.collapsed{height:0;padding:0}
#ribbon.float{position:absolute;top:78px;left:0;right:0;height:110px;z-index:60;background:transparent}
#ribbon.float .rpanel{box-shadow:0 8px 24px rgba(0,0,0,.22)}
.rpanel{display:none;height:102px;padding:4px 4px 0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;background:var(--card);border:1px solid #e3e3e3;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rpanel.show{display:flex}
.rpanel::-webkit-scrollbar{height:6px}.rpanel::-webkit-scrollbar-thumb{background:#c8c8c8;border-radius:3px}
.grp{display:flex;flex-direction:column;padding:0 6px;position:relative;flex:none}
.grp+.grp::before{content:"";position:absolute;left:0;top:4px;bottom:6px;width:1px;background:#e1e1e1}
.grp .body{display:flex;gap:2px;flex:1;align-items:stretch;padding-top:1px}
.grp .lbl{text-align:center;font-size:11px;color:var(--mut);height:18px;line-height:17px;padding:0 14px;white-space:nowrap}
.grp .launch{position:absolute;right:3px;bottom:3px;width:13px;height:13px;border:0;background:none;padding:0;opacity:.75;border-radius:2px}
.grp .launch::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-right:1.3px solid #555;border-bottom:1.3px solid #555}
.grp .launch::before{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:1.3px;background:#555;transform:rotate(-45deg);transform-origin:right}
.grp .launch:hover{opacity:1;background:var(--hover)}
.col{display:flex;flex-direction:column;justify-content:center;gap:2px}
.row{display:flex;align-items:center;gap:1px;height:24px}
.btn{border:1px solid transparent;background:transparent;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;height:24px;color:var(--txt);position:relative;white-space:nowrap;font-size:12px}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn.on{background:var(--on)}
.btn.on:hover{background:var(--on-h)}
.btn.big{flex-direction:column;height:auto;min-width:48px;padding:3px 5px 2px;gap:2px;justify-content:flex-start;line-height:1.15;font-size:12px;white-space:normal;text-align:center}
.btn.big .t{display:block;max-width:76px}
.btn.big[data-id=hfClose] .t{max-width:130px}
.btn .car{width:0;height:0;border:3.5px solid transparent;border-top:4px solid #616161;margin-top:2px}
.btn.big .car{margin-top:1px}
.btn.w{padding:0 5px;justify-content:flex-start}
.splitwrap{display:inline-flex;align-items:stretch;border-radius:4px}
.splitwrap:hover{box-shadow:inset 0 0 0 1px #d6d6d6}
.splitwrap.vert{flex-direction:column}
.splitwrap .btn.arrow{padding:0 2px;min-width:13px;height:24px}
.splitwrap.vert .btn.arrow{height:auto;min-height:15px;border-top-left-radius:0;border-top-right-radius:0;padding:0}
.splitwrap.vert .btn.big{border-bottom-left-radius:0;border-bottom-right-radius:0}
.splitwrap:not(.vert) .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.splitwrap:not(.vert) .btn.arrow{border-top-left-radius:0;border-bottom-left-radius:0}
.vsep{width:1px;height:18px;background:#e1e1e1;margin:0 3px}
.combo{display:flex;align-items:center;height:24px;border:1px solid #d1d1d1;border-bottom-color:#a8a8a8;background:#fff;border-radius:4px;position:relative}
.combo:hover{border-color:#c2c2c2;border-bottom-color:#8a8a8a}
.combo input{border:0;outline:0;background:transparent;height:22px;padding:0 5px;min-width:0;font-size:12px}
.combo:focus-within{border-bottom:2px solid var(--blue);height:24px}
.combo .dd{width:18px;height:22px;display:grid;place-items:center;cursor:pointer;border:0;background:none;padding:0;border-radius:0 3px 3px 0}
.combo .dd::after{content:"";border:3.5px solid transparent;border-top:4px solid #616161;margin-top:3px}
.combo .dd:hover{background:#ebebeb}
#c-fontName{width:136px}#c-fontName input{width:104px}
#c-fontSize{width:52px}#c-fontSize input{width:30px;text-align:left}
.gallery{display:flex;align-items:stretch;border:1px solid #e1e1e1;background:#fff;border-radius:4px;height:70px;margin-top:1px;overflow:hidden}
.gallery .tiles{display:flex;padding:2px;gap:2px}
.tile{width:74px;border:1px solid transparent;background:#fff;padding:6px 5px 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;overflow:hidden;text-align:left;border-radius:3px;gap:0}
.tile:hover{border-color:#c7c7c7;background:#f5f5f5}.tile.on{border:1px solid #8a8a8a;background:#ebebeb}
.tile .sample{font-size:12px;line-height:1.1;max-width:66px;overflow:hidden;white-space:nowrap;height:26px;display:flex;align-items:flex-end}
.tile .nm{font-size:10.5px;color:#424242;margin-top:auto;padding-bottom:5px;font-family:var(--ui)}
.gscroll{width:17px;display:flex;flex-direction:column;border-left:1px solid #e8e8e8}
.gscroll button{flex:1;border:0;background:#fff;padding:0;display:grid;place-items:center}.gscroll button:hover{background:#ebebeb}
.gscroll button::after{content:"";border:3.5px solid transparent}
.gscroll .up::after{border-bottom:4px solid #616161;margin-bottom:2px}.gscroll .dn::after{border-top:4px solid #616161;margin-top:2px}
.gscroll .mr::after{border-top:4px solid #616161;margin-top:2px;box-shadow:0 -6px 0 -1px #616161}
.num{width:64px;height:24px;border:1px solid #d1d1d1;border-bottom-color:#a8a8a8;border-radius:4px;padding:0 4px;background:#fff;outline:0}
.num:focus{border-bottom:2px solid var(--blue)}
.lblr{font-size:12px;width:96px;text-align:left;color:#424242}
.spot{animation:spot 1.1s ease-in-out infinite;outline:2px solid #ff8c00!important;outline-offset:1px;z-index:5;position:relative;background:#fff3d6!important;border-radius:4px}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(255,140,0,.65)}50%{box-shadow:0 0 0 9px rgba(255,140,0,0)}}

/* ---------- Descrizione comando ---------- */
#tip{position:fixed;z-index:1000;background:#fff;border:1px solid #d1d1d1;box-shadow:0 4px 12px rgba(0,0,0,.16);padding:8px 11px 9px;max-width:270px;pointer-events:none;display:none;font-size:12px;border-radius:4px}
#tip b{display:block;margin-bottom:4px;font-weight:600}#tip b em{font-style:normal;font-weight:400;color:#616161;margin-left:6px}
#tip p{margin:0;color:#424242;line-height:1.4}

/* ---------- Menu ---------- */
.popup{position:fixed;z-index:900;background:#fff;border:1px solid #e0e0e0;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:6px;padding:4px;min-width:200px;max-height:80vh;overflow:auto;font-size:12.5px;animation:pdn .12s ease-out}
@keyframes pdn{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
.popup .mi{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 8px;cursor:pointer;white-space:nowrap;min-height:30px;border-radius:4px}
.popup .mi:hover{background:#f0f0f0}.popup .mi.on{background:#e6e6e6;font-weight:600}
.popup .mi .mic{width:20px;display:grid;place-items:center}
.popup .mi .sc{margin-left:auto;padding-left:24px;color:#757575}
.popup .mi.dis{opacity:.45;pointer-events:none}
.popup hr{border:0;border-top:1px solid #e8e8e8;margin:4px -4px}
.popup .mh{padding:6px 10px;font-weight:600;color:#424242;background:#f5f5f5;margin:2px -4px;font-size:12px}
.popup .mh:first-child{margin-top:-4px;border-radius:6px 6px 0 0}
.swatches{display:grid;grid-template-columns:repeat(10,17px);gap:3px;padding:4px 10px 6px}
.sw{width:17px;height:17px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;border-radius:2px}.sw:hover{outline:2px solid #616161;outline-offset:1px;z-index:2}
.popup .cap{padding:6px 10px 2px;color:#424242;font-size:12px;font-weight:600}
.tblgrid{padding:6px 6px}
.tblgrid .lab{font-size:12px;margin-bottom:6px;color:#242424;font-weight:600}
.tblgrid .g{display:grid;grid-template-columns:repeat(10,18px);gap:2px}
.tblgrid .g i{width:18px;height:18px;border:1px solid #c7c7c7;background:#fff;display:block}.tblgrid .g i.h{border-color:#d9691f;background:#fde9d9}
.shapegrid{display:grid;grid-template-columns:repeat(6,34px);gap:2px;padding:6px 6px}
.shapegrid button{width:34px;height:34px;border:1px solid transparent;background:#fff;display:grid;place-items:center;border-radius:4px}.shapegrid button:hover{background:#f0f0f0;border-color:#d1d1d1}
.charm{display:grid;grid-template-columns:repeat(8,38px);gap:2px;padding:6px}
.charm button{width:38px;height:38px;border:1px solid #e0e0e0;background:#fff;font-size:18px;border-radius:4px}.charm button:hover{background:#f0f0f0;border-color:#c7c7c7}
.pgprev{width:62px;height:78px;border:1px solid #c7c7c7;background:#fff;position:relative;margin:4px auto}
.gal{display:flex;flex-wrap:wrap;gap:6px;padding:6px;width:340px}
.gal .card{width:100px;border:1px solid #e0e0e0;border-radius:4px;padding:6px;cursor:pointer;background:#fff;font-size:11px;text-align:center}.gal .card:hover{border-color:#8a8a8a;background:#f5f5f5}

/* ---------- Area di lavoro ---------- */
#main{flex:1;display:flex;min-height:0;position:relative;background:var(--canvas)}
#navpane,#sidepane{width:288px;background:#fff;display:none;flex-direction:column;flex:none;border-right:1px solid #e0e0e0;z-index:5}
#sidepane{border-right:0;border-left:1px solid #e0e0e0;width:310px}
#navpane.show,#sidepane.show{display:flex}
.pane-h{display:flex;align-items:center;padding:12px 12px 8px 16px;font-weight:600;font-size:15px;gap:8px}
.pane-h .x{margin-left:auto;border:0;background:none;font-size:14px;width:28px;height:28px;border-radius:4px;color:#424242}.pane-h .x:hover{background:#ebebeb}
.pane-tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid #e8e8e8}
.pane-tabs button{border:0;background:none;padding:7px 0;border-bottom:2px solid transparent;color:#424242}.pane-tabs button.on{border-color:var(--blue);color:#242424;font-weight:600}
.pane-b{flex:1;overflow:auto;padding:8px 16px}
.pane-b .srch{display:flex;border:1px solid #d1d1d1;border-bottom-color:#8a8a8a;border-radius:4px;margin-bottom:8px;background:#fff}.pane-b .srch:focus-within{border-bottom:2px solid var(--blue)}.pane-b .srch input{flex:1;border:0;outline:0;padding:6px 8px;min-width:0;background:transparent}.pane-b .srch button{border:0;background:none;width:28px;border-radius:3px}.pane-b .srch button:hover{background:#ebebeb}
.hitem{padding:6px 8px;border-radius:4px;cursor:pointer;color:#242424}.hitem:hover{background:#f0f0f0}
.hitem.l2{padding-left:24px}.hitem.l3{padding-left:40px;color:#424242}
.resitem{padding:7px 8px;border-radius:4px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:12px;line-height:1.4}.resitem:hover{background:#f5f5f5}.resitem.cur{background:#e6e6e6}
.resitem mark{background:#ffe38a;padding:0;font-weight:600}
.cmtcard{border:1px solid #e0e0e0;background:#fff;border-radius:6px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cmtcard:focus-within{border-color:#8a8a8a;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.cmtcard .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;margin-bottom:6px}.cmtcard .who b{width:24px;height:24px;border-radius:50%;background:#c19c00;color:#fff;display:grid;place-items:center;font-size:9.5px}
.cmtcard .q{color:#616161;font-size:11.5px;border-left:3px solid #d1d1d1;padding-left:7px;margin-bottom:6px;max-height:34px;overflow:hidden}
.cmtcard textarea{width:100%;border:1px solid #d1d1d1;border-radius:4px;padding:6px;resize:vertical;min-height:46px;outline:0}.cmtcard textarea:focus{border-bottom:2px solid var(--blue)}
.cmtcard .acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}

L(2, 'Ripulire i testi: MAIUSC.INIZ e ANNULLA.SPAZI', 'I dati importati sono spesso disordinati: spazi in più, MAIUSCOLE a caso. <b>ANNULLA.SPAZI</b> toglie gli spazi superflui, <b>MAIUSC.INIZ</b> mette l\'iniziale maiuscola a ogni parola, <b>MAIUSC</b> e <b>MINUSC</b> cambiano tutto. Le funzioni si possono annidare.',
  { title: 'Iscritti importati', data: grid([['Nome importato', 'Nome pulito', 'Provincia', 'Sigla'], ['  mario   ROSSI ', '', 'mi', ''], ['GIULIA  bianchi', '', 'to', ''], ['  paolo verdi', '', 'bo', ''], ['ANNA   maria  neri  ', '', 'pd', '']]), st: { 'A1:D1': HEAD }, colW: { A: 170, B: 150 } }, [
  { text: 'In <b>B2</b>: <code class="url">=MAIUSC.INIZ(ANNULLA.SPAZI(A2))</code>, copia fino a <b>B5</b>.', path: ['cell:B2'], done: Q => Q.v('B2') === 'Mario Rossi' && Q.v('B5') === 'Anna Maria Neri' && rows(2, 5, r => Q.has('B' + r, 'MAIUSC.INIZ(')), hints: ['Prima ANNULLA.SPAZI ripulisce gli spazi, poi MAIUSC.INIZ sistema le maiuscole.'], solve: Q => { Q.set('B2', '=MAIUSC.INIZ(ANNULLA.SPAZI(A2))'); fillTo('B2', 'B2:B5'); }, ok: 'Nomi in ordine.' },
  { text: 'In <b>D2</b>: <code class="url">=MAIUSC(C2)</code>, copia fino a <b>D5</b>.', path: ['cell:D2'], done: Q => rows(2, 5, r => Q.v('D' + r) === Q.raw('C' + r).toUpperCase() && Q.isF('D' + r)), hints: ['MI, TO, BO, PD.'], solve: Q => { Q.set('D2', '=MAIUSC(C2)'); fillTo('D2', 'D2:D5'); }, ok: 'Sigle uniformi.' }
], { cells: ['B2:B5', 'D2:D5'], cmds: ['fill'] });

L(2, 'Calcoli con le date', 'Le date sono numeri: sottraendo due date ottieni i <b>giorni</b> che le separano. <b>OGGI()</b> restituisce la data di oggi (si aggiorna ogni giorno). <b>DATA.DIFF(inizio; fine; "Y")</b> calcola gli anni compiuti ("M" i mesi, "D" i giorni).',
  { title: 'Personale', data: Object.assign(grid([['Dipendente', 'Assunto il', 'Anni di servizio'], ['Laura', '12/03/2014', ''], ['Paolo', '01/09/2019', ''], ['Sara', '15/01/2008', ''], ['Luca', '20/06/2022', '']]), { E1: 'Data di riferimento', F1: '31/12/2025', E3: 'Oggi è', E4: 'Giorni a fine anno' }), st: { 'A1:C1': HEAD, 'B2:B5': { nf: 'date' }, E1: { b: 1 }, F1: { nf: 'date', fill: '#ffeb9c' }, 'E3:E4': { b: 1 } }, colW: { B: 100, C: 120, E: 150, F: 110 } }, [
  { text: 'In <b>C2</b>: <code class="url">=DATA.DIFF(B2;$F$1;"Y")</code>, copia fino a <b>C5</b>.', path: ['cell:C2'], done: Q => rows(2, 5, r => Q.has('C' + r, 'DATA.DIFF(B' + r + ';$F$1')) && Q.v('C2') === 11 && Q.v('C4') === 17, wrong: fWrong('C2', 11), hints: ['Data di inizio: B2. Fine: la data di riferimento bloccata $F$1. Unità: "Y" (anni).'], solve: Q => { Q.set('C2', '=DATA.DIFF(B2;$F$1;"Y")'); fillTo('C2', 'C2:C5'); }, ok: 'Anzianità calcolata.' },
  { text: 'In <b>F3</b> scrivi <code class="url">=OGGI()</code> e dagli il formato <b>Data in cifre</b>.', path: ['cell:F3'], done: Q => Q.has('F3', 'OGGI()') && ['date', 'dateL'].includes(Q.st('F3').nf), hints: ['OGGI non ha argomenti: le parentesi restano vuote.', 'Poi scegli Data in cifre dall\'elenco Formato numero.'], solve: Q => { Q.set('F3', '=OGGI()'); Q.select('F3'); run('nf', 'date'); }, ok: 'Data di oggi, sempre aggiornata.' },
  { text: 'In <b>F4</b> calcola i giorni che mancano a fine anno: <code class="url">=DATA(ANNO(F3);12;31)-F3</code>.', path: ['cell:F4'], done: Q => Q.has('F4', 'DATA(ANNO(F3);12;31)-F3') && typeof Q.v('F4') === 'number', hints: ['DATA costruisce una data da anno, mese e giorno.', 'Se compare una data invece di un numero, scegli il formato Generale.'], solve: Q => { Q.set('F4', '=DATA(ANNO(F3);12;31)-F3'); Q.select('F4'); run('nf', 'gen'); }, ok: 'Conto alla rovescia automatico.' }
], { cells: ['C2:C5', 'F3:F4'], cmds: ['fill', 'nf'] });

L(2, 'Testo in colonne', 'Se in una sola colonna ci sono più informazioni separate da un simbolo (es. «Rossi;Mario;Milano»), <b>Dati › Testo in colonne</b> le divide in colonne diverse, scegliendo il <b>delimitatore</b>.',
  { title: 'Esportazione', data: grid([['Cognome;Nome;Città'], ['Rossi;Mario;Milano'], ['Bianchi;Laura;Torino'], ['Verdi;Gianni;Napoli'], ['Neri;Paola;Bari']]), colW: { A: 160 } }, [
  selStep('A1:A5', { text: 'Seleziona <b>A1:A5</b>.' }),
  { text: 'Dati › <b>Testo in colonne</b>: scegli il delimitatore <b>Punto e virgola</b> e premi <b>Fine</b>.', path: ['tab:data', 't2cBtn', 't2c-semi', 't2cOk'], done: Q => Q.raw('A2') === 'Rossi' && Q.raw('B2') === 'Mario' && Q.raw('C5') === 'Bari' && Q.raw('C1') === 'Città', hints: ['Nella finestra spunta «Punto e virgola».'], solve: Q => { Q.select('A1:A5'); run('textToCols', { sep: ';' }); }, ok: 'Una colonna è diventata tre.' }
], { cells: ['A1:C5'], cmds: ['textToCols'] });

/* ======================= MODULO 4 · ANALISI DEI DATI ======================= */
const REG = ['Nord', 'Centro', 'Sud'], PRD = ['Caffè', 'Tè', 'Tisane'], VND = ['Rossi', 'Verdi', 'Neri', 'Galli'];
const VEN = [['Data', 'Regione', 'Prodotto', 'Venditore', 'Importo']].concat([...Array(24).keys()].map(i => [`${String(1 + (i * 3) % 28).padStart(2, '0')}/${String(1 + Math.floor(i / 8)).padStart(2, '0')}/2026`, REG[(i * 2) % 3], PRD[(i * 5) % 3], VND[i % 4], String(200 + ((i * 137) % 900))]));
const VSUM = (k, v) => VEN.slice(1).filter(r => r[1] === v).reduce((s, r) => s + +r[4], 0);
const VST2 = { 'A1:E1': HEAD, 'A2:A25': { nf: 'date' }, 'E2:E25': { nf: 'eur', dec: 0 } };
L(3, 'Creare una tabella pivot', 'La <b>tabella pivot</b> riassume migliaia di righe in pochi secondi: scegli quali campi mettere nelle <b>righe</b> e quali nei <b>valori</b>, Excel raggruppa e somma. I dati originali non vengono toccati: la pivot va su un foglio nuovo.',
  { title: 'Vendite trimestre', data: grid(VEN), st: VST2, colW: { A: 90, D: 90 } }, [
  { text: 'Fai clic in una cella dei dati e scegli Inserisci › <b>Tabella pivot</b>, poi <b>OK</b>.', path: ['cell:B3', 'tab:insert', 'pivotBtn', 'pvOk'], done: Q => WB.sheets.some(s => s.pivot), hints: ['Excel propone l\'intervallo Foglio1!$A$1:$E$25 e un nuovo foglio di lavoro.'], solve: Q => { Q.select('B3'); run('pivotCreate', { src: 'Foglio1!A1:E25' }); renderPivotPane(); }, ok: 'A destra compare il riquadro Campi tabella pivot.' },
  { text: 'Nel riquadro spunta <b>Regione</b> (va nelle Righe) e <b>Importo</b> (va nei Valori).', path: ['pvf-Regione', 'pvf-Importo'], done: Q => { const s = WB.sheets.find(x => x.pivot); return !!s && s.pivot.rows === 'Regione' && s.pivot.val === 'Importo'; }, hints: ['I campi di testo vanno da soli nelle Righe, quelli numerici nei Valori.', 'Se il riquadro è chiuso: Analisi tabella pivot › Elenco campi.'], solve: Q => { run('pivotSet', { rows: 'Regione', val: 'Importo', op: 'sum' }); }, ok: `Somma degli importi per regione, con il totale complessivo.` }
], { free: true });

L(3, 'Modificare una tabella pivot', 'Una pivot si cambia in un attimo: trascina un altro campo nelle Righe per vedere i dati da un altro punto di vista, e con <b>Impostazioni campo valore</b> passi da <b>Somma</b> a <b>Media</b>, <b>Conteggio</b>, <b>Max</b>…',
  { title: 'Vendite trimestre', data: grid(VEN), st: VST2, colW: { A: 90, D: 90 } }, [
  { text: 'Nel riquadro, cambia le <b>Righe</b> da Regione a <b>Venditore</b> (elenco «≡ Righe»).', path: ['pvRows'], done: Q => (SH().pivot || {}).rows === 'Venditore', hints: ['Se il riquadro non si vede: scheda Analisi tabella pivot › Elenco campi.'], solve: Q => run('pivotSet', { rows: 'Venditore' }), ok: 'Ora vedi le vendite per venditore.' },
  { text: 'Analisi tabella pivot › <b>Impostazioni campo valore</b> › <b>Media</b>.', path: ['tab:pivot', 'pvOpBtn', 'pvop-avg'], done: Q => (SH().pivot || {}).op === 'avg', hints: ['La scheda contestuale compare quando il foglio contiene la pivot.'], solve: Q => run('pivotSet', { op: 'avg' }), ok: 'Importo medio per venditore: chi fa ordini più grandi?' },
  { text: 'Prova anche <b>Conteggio</b>: quanti ordini ha fatto ciascuno?', path: ['tab:pivot', 'pvOpBtn', 'pvop-count'], done: Q => (SH().pivot || {}).op === 'count', hints: ['Stesso menu, voce Conteggio.'], solve: Q => run('pivotSet', { op: 'count' }), ok: 'Sei ordini a testa: una sola tabella, tre domande diverse.' }
], { free: true, setup: Q => { CMD.pivotCreate({ src: 'Foglio1!A1:E25' }); Object.assign(SH().pivot, { rows: 'Regione', val: 'Importo', op: 'sum' }); buildPivot(SH()); setTimeout(renderPivotPane, 0); } });

L(3, 'Ricerca obiettivo', '<b>Ricerca obiettivo</b> (Dati › Analisi di simulazione) lavora al contrario: conosci il <b>risultato</b> che vuoi ottenere e Excel trova il valore di partenza. Esempio: a che prezzo devo vendere per guadagnare 15.000 €?',
  { title: 'Previsione utile', data: grid([['Prezzo di vendita', '25'], ['Quantità prevista', '800'], ['Costi fissi', '9000'], ['Costo unitario', '12'], ['Utile', '=B1*B2-B3-B4*B2']]), st: { 'A1:A5': { b: 1 }, B1: { nf: 'eur', dec: 2, fill: '#ffeb9c' }, 'B3:B4': { nf: 'eur', dec: 2 }, B5: { nf: 'eur', dec: 2, b: 1 } }, colW: { A: 140, B: 110 } }, [
  { text: 'Con il prezzo attuale l\'utile (B5) è 1.400 €. Apri Dati › <b>Analisi di simulazione</b> › <b>Ricerca obiettivo</b>.', path: ['cell:B5', 'tab:data', 'whatIf', 'wi-goal'], done: Q => !!$('[data-id="gsSet"]') || near(Q.v('B5'), 15000), hints: ['Gruppo Previsione della scheda Dati.'], solve: Q => { Q.select('B5'); run('goalSeekDlg'); }, ok: 'Finestra aperta.' },
  { text: 'Imposta la cella <b>B5</b>, al valore <b>15000</b>, cambiando la cella <b>B1</b>. OK.', path: ['gsSet', 'gsTo', 'gsBy', 'gsOk', 'gsDone'], done: Q => near(Q.v('B5'), 15000) && near(Q.v('B1'), 42), hints: ['Prima casella: la formula da raggiungere (B5). Seconda: il valore 15000. Terza: la cella da far variare (B1).'], solve: Q => { $('#modal').classList.remove('show'); run('goalSeek', { set: 'B5', to: '15000', by: 'B1' }); }, ok: 'Serve un prezzo di 42 €.' }
], { cells: ['B1'], cmds: ['goalSeek'] });

L(3, 'Filtri numerici avanzati', 'Oltre a scegliere i valori dall\'elenco, il filtro offre <b>Filtri per numeri</b>: maggiore di, tra, sopra la media e <b>Primi 10</b> (i valori più alti, anche solo 3 o 5).',
  { title: 'Vendite trimestre', data: grid(VEN), st: VST2, colW: { A: 90, D: 90 }, filter: 'A1:E25' }, [
  { text: 'Apri il filtro di <b>Importo</b> (E1) › <b>Filtri per numeri</b> › <b>Primi 10…</b>: mostra i primi <b>5</b> e OK.', path: ['fbtn-E', 'fm-num', 'fn-top', 'nfA', 'nfOk'], done: Q => { const k = (SH().filter || {}).crit || {}; return k[4] && k[4].op === 'top' && k[4].a === 5; }, hints: ['Nella finestra scrivi 5 al posto di 10.'], solve: Q => run('filterSet', { c: 4, crit: { op: 'top', a: 5 } }), ok: 'I 5 ordini più grandi.' },
  { text: 'Ora sostituisci il filtro con <b>Maggiore di… 800</b>.', path: ['fbtn-E', 'fm-num', 'fn-gt', 'nfA', 'nfOk'], done: Q => { const k = (SH().filter || {}).crit || {}; return k[4] && k[4].op === 'gt' && k[4].a === 800; }, hints: ['Stesso menu, voce «Maggiore di…».'], solve: Q => run('filterSet', { c: 4, crit: { op: 'gt', a: 800 } }), ok: 'Solo gli ordini sopra 800 €.' }
], { cells: [], cmds: ['filterSet'] });

L(3, 'Formattazione condizionale con formula', 'Con una <b>formula</b> la formattazione condizionale diventa potentissima: per esempio colorare <b>l\'intera riga</b> di una pratica scaduta. Seleziona tutte le righe e usa un riferimento con la colonna bloccata: <b>=$D2="Scaduto"</b>.',
  { title: 'Pratiche', data: grid([['Pratica', 'Cliente', 'Scadenza', 'Stato'], ['PR-101', 'Alfa srl', '10/01/2026', 'Chiuso'], ['PR-102', 'Beta spa', '15/01/2026', 'Scaduto'], ['PR-103', 'Gamma snc', '02/02/2026', 'Aperto'], ['PR-104', 'Delta srl', '20/12/2025', 'Scaduto'], ['PR-105', 'Epsilon', '28/02/2026', 'Aperto']]), st: { 'A1:D1': HEAD, 'C2:C6': { nf: 'date' } }, colW: { B: 100, C: 100 } }, [
  selStep('A2:D6', { text: 'Seleziona tutte le righe dei dati <b>A2:D6</b> (senza intestazione).' }),
  { text: 'Formattazione condizionale › <b>Nuova regola con formula…</b>: scrivi <code class="url">=$D2="Scaduto"</code>, formato rosso, OK.', path: ['cfBtn', 'cf-formula', 'cfA', 'cfOk'], done: Q => SH().cf.some(r => r.t === 'formula' && r.range === 'A2:D6' && /\$D2="SCADUTO"/i.test(r.f.replace(/\s/g, ''))), wrong: Q => { const r = SH().cf.find(x => x.t === 'formula'); if (r && !/\$D/i.test(r.f)) return { title: 'Colonna non bloccata', msg: 'Senza il $ davanti alla D, Excel controllerebbe colonne diverse per ogni cella della riga. Scrivi <b>=$D2="Scaduto"</b>.' }; return null; }, hints: ['Il riferimento è alla prima riga selezionata (riga 2), con la colonna D bloccata.'], solve: Q => { Q.select('A2:D6'); run('cf', { t: 'formula', f: '=$D2="Scaduto"', fmt: 'red' }); }, ok: 'Le righe scadute sono rosse per intero.' }
], { cells: [], cmds: ['cf'] });

/* ======================= MODULO 5 · CONTROLLO E PROTEZIONE ======================= */
L(4, 'Convalida con messaggio di errore', 'La convalida può accettare solo <b>numeri interi</b> in un intervallo (es. età tra 18 e 99). Nella scheda <b>Messaggio di errore</b> scrivi un avviso chiaro: chi compila il foglio capisce subito cosa ha sbagliato.',
  { title: 'Iscrizioni', data: grid([['Nome', 'Età'], ['Carla', '34'], ['Matteo', ''], ['Irene', ''], ['Bruno', '']]), st: { 'A1:B1': HEAD } }, [
  selStep('B2:B5', { text: 'Seleziona le età <b>B2:B5</b>.' }),
  { text: 'Dati › <b>Convalida dati</b>: Consenti <b>Numero intero</b>, <b>tra</b> 18 e 99. Nella scheda <b>Messaggio di errore</b> scrivi un titolo (es. «Età non valida»). OK.', path: ['tab:data', 'validBtn', 'vType', 'vMin', 'vMax', 'vTab-err', 'vErrT', 'vOk'], done: Q => SH().valids.some(v => v.type === 'whole' && +v.a === 18 && +v.b === 99 && (v.errTitle || '').length >= 3), hints: ['Prima scheda: Consenti Numero intero, Dati tra, Minimo 18, Massimo 99.', 'Seconda scheda: scrivi il titolo del messaggio.'], solve: Q => { Q.select('B2:B5'); run('validation', { type: 'whole', op: 'between', a: 18, b: 99, errTitle: 'Età non valida', errMsg: 'Inserisci un numero intero tra 18 e 99.' }); }, ok: 'Regola impostata.' },
  { text: 'Prova: scrivi <b>150</b> in <b>B3</b>. Excel mostra il tuo messaggio: premi <b>Annulla</b>, poi scrivi <b>27</b>.', path: ['cell:B3'], done: Q => !!C.flags.vErr && Q.n('B3') === 27, hints: ['Nel messaggio scegli Annulla, poi riscrivi 27.'], solve: Q => { C.flags.vErr = true; Q.set('B3', '27'); }, ok: 'La convalida protegge i dati.' }
], { cells: ['B3:B5'], cmds: ['validation'] });
on('cmd', ev => { if (ev.name === 'dialog' && LESSONS[C.li] && /Convalida con/.test(LESSONS[C.li].title) && ev.arg !== 'Convalida dati') C.flags.vErr = true; });

L(4, 'Proteggere il foglio', 'Per evitare che qualcuno cancelli le formule per errore: prima <b>sblocca</b> le celle che si possono compilare (Home › Formato › Blocca cella, oppure Formato celle › Protezione), poi <b>Revisione › Proteggi foglio</b>. Le celle ancora bloccate non si potranno modificare.',
  { title: 'Preventivo', data: grid([['Voce', 'Quantità', 'Prezzo', 'Totale'], ['Imbiancatura (m²)', '80', '9', '=B2*C2'], ['Stuccatura (ore)', '6', '35', '=B3*C3'], ['Materiale', '1', '240', '=B4*C4'], ['Totale preventivo', '', '', '=SOMMA(D2:D4)']]), st: { 'A1:D1': HEAD, 'C2:D5': { nf: 'eur', dec: 2 }, 'A5:D5': { b: 1 }, 'B2:C4': { fill: '#ffeb9c' } }, colW: { A: 150 } }, [
  selStep('B2:C4', { text: 'Seleziona le celle da compilare <b>B2:C4</b> (in giallo).' }),
  { text: 'Home › <b>Formato</b> › <b>Blocca cella</b> per <b>sbloccarle</b> (oppure Formato celle › Protezione › togli «Bloccata»).', path: ['fmtBtn', 'fm-lock'], done: Q => Q.all('B2:C4', k => Q.st(k).locked === false), hints: ['Blocca cella è una voce «a interruttore»: con le celle bloccate (predefinito) è attiva, un clic la disattiva.'], solve: Q => { Q.select('B2:C4'); run('lockCell'); }, ok: 'Celle di input sbloccate.' },
  { text: 'Revisione › <b>Proteggi foglio</b> › OK.', path: ['tab:review', 'protBtn', 'prOk'], done: Q => !!SH().protect, hints: ['La password è facoltativa.'], solve: Q => { $('#modal').classList.remove('show'); run('protect', true); }, ok: 'Foglio protetto.' },
  { text: 'Verifica: cambia la quantità in <b>B2</b> in <b>90</b> (si può), poi prova a scrivere in <b>D2</b> (Excel lo impedisce).', path: ['cell:B2'], done: Q => Q.n('B2') === 90 && !!C.flags.protMsg, hints: ['Nel messaggio di protezione premi OK.'], solve: Q => { Q.set('B2', '90'); C.flags.protMsg = true; }, ok: 'Il totale si aggiorna, ma le formule sono al sicuro.' }
], { cells: ['B2:C4'], fmt: ['B2:C4'], cmds: ['lockCell', 'protect'] });
on('cmd', ev => { if (ev.name === 'dialog' && ev.arg === 'Microsoft Excel' && LESSONS[C.li] && /Proteggere/.test(LESSONS[C.li].title)) C.flags.protMsg = true; });

L(4, 'Mostrare le formule e aggiungere note', '<b>Formule › Mostra formule</b> mostra nelle celle i calcoli invece dei risultati: utile per controllare un foglio. Le <b>note</b> (Revisione › Nuova nota) spiegano una cella a chi leggerà il file: un triangolino rosso indica che c\'è una nota.',
  { title: 'Calcolo IVA', data: grid([['Imponibile', '1250'], ['Aliquota', '22%'], ['IVA', '=B1*B2'], ['Totale fattura', '=B1+B3']]), st: { 'A1:A4': { b: 1 }, B1: { nf: 'eur', dec: 2 }, 'B3:B4': { nf: 'eur', dec: 2 } }, colW: { A: 120, B: 110 } }, [
  { text: 'Formule › <b>Mostra formule</b>: guarda i calcoli nelle celle.', path: ['tab:formulas', 'showFBtn'], done: Q => !!SH().showF || C.stepDone[0], hints: ['Gruppo Verifica formule.'], solve: Q => run('showFormulas'), ok: 'Ecco come è costruito il foglio.' },
  { text: 'Premi di nuovo <b>Mostra formule</b> per tornare ai risultati.', path: ['tab:formulas', 'showFBtn'], done: Q => !SH().showF && C.stepDone[0], hints: ['Stesso pulsante.'], solve: Q => run('showFormulas'), ok: 'Risultati di nuovo visibili.' },
  { text: 'Clic su <b>B2</b>, Revisione › <b>Nuova nota</b> e scrivi <b>Aliquota ordinaria 2026</b>, poi clicca fuori dalla nota.', path: ['cell:B2', 'tab:review', 'noteNew'], done: Q => /aliquota/i.test((getCell(homeSheet(), 'B2') || {}).note || ''), hints: ['Compare un riquadro giallo accanto alla cella: scrivi il testo.'], solve: Q => { const c = cellOf(homeSheet(), 'B2'); c.note = 'Aliquota ordinaria 2026'; histPush(); renderValues(); }, ok: 'Nota aggiunta: passa il mouse su B2 per leggerla.' }
], { cells: [], fmt: ['B2'], free: true, cmds: ['showFormulas'] });

L(4, 'Incolla speciale: valori e trasponi', '<b>Incolla › Valori</b> incolla solo i risultati, senza formule: utile per «congelare» dei calcoli prima di inviarli. <b>Incolla › Trasponi</b> scambia righe e colonne. Si trovano nella freccetta sotto Incolla.',
  { title: 'Chiusura mese', data: grid([['Negozio', 'Incasso', 'Costi', 'Margine'], ['Centro', '18400', '12100', '=B2-C2'], ['Stazione', '13900', '9800', '=B3-C3'], ['Outlet', '22500', '16700', '=B4-C4']]), st: { 'A1:D1': HEAD, 'B2:D4': { nf: 'eur', dec: 0 } }, colW: { F: 90 } }, [
  { text: 'Seleziona i margini <b>D2:D4</b> e premi <b>Copia</b>.', path: ['cell:D2', 'copy'], done: Q => !!S.clip && rangeStr(S.clip.g) === 'D2:D4', hints: ['Ctrl+C dopo la selezione.'], solve: Q => { Q.select('D2:D4'); run('copy'); }, ok: 'Copiati.' },
  { text: 'Clic su <b>F2</b>, freccetta di Incolla › <b>Valori</b>.', path: ['cell:F2', 'paste-arrow', 'pasteV'], done: Q => Q.n('F2') === 6300 && !Q.isF('F2') && Q.n('F4') === 5800, wrong: Q => Q.isF('F2') ? { title: 'Hai incollato le formule', msg: 'In F2 c\'è una formula: usa la freccetta di Incolla › <b>Valori</b>. Annulla con Ctrl+Z.' } : null, hints: ['Sotto Incolla valori, il pulsante «Valori» (123).'], solve: Q => { Q.select('F2'); run('paste', 'values'); }, ok: 'Numeri «congelati»: non cambiano più se cambiano incassi e costi.' },
  { text: 'Ora copia i nomi dei negozi <b>A2:A4</b> e incollali in <b>A7</b> con <b>Trasponi</b>: diventano una riga.', path: ['cell:A2', 'copy', 'cell:A7', 'paste-arrow', 'pasteT'], done: Q => Q.raw('A7') === 'Centro' && Q.raw('B7') === 'Stazione' && Q.raw('C7') === 'Outlet', hints: ['Copia A2:A4, clic su A7, freccetta di Incolla › Trasponi.'], solve: Q => { Q.select('A2:A4'); run('copy'); Q.select('A7'); run('paste', 'transpose'); }, ok: 'Da colonna a riga in un clic.' }
], { cells: ['F2:F4', 'A7:C7'], fmt: ['F2:F4', 'A7:C7'], cmds: ['paste'] });

/* ======================= MODULO 6 · STRUMENTI PROFESSIONALI ======================= */
L(5, 'Sparkline: minigrafici nelle celle', 'Le <b>sparkline</b> sono minigrafici dentro una cella: mostrano l\'andamento di una riga di dati accanto ai numeri. Inserisci › <b>Sparkline</b> › Linee: scegli l\'intervallo dei dati e le celle dove disegnarle.',
  { title: 'Andamento prodotti', data: grid([['Prodotto', 'Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Tendenza'], ['Caffè', '120', '135', '128', '150', '162', '171', ''], ['Tè', '80', '76', '71', '69', '72', '65', ''], ['Tisane', '45', '52', '61', '58', '70', '83', ''], ['Cioccolata', '95', '88', '60', '42', '35', '30', '']]), st: { 'A1:H1': HEAD }, colW: { H: 110 } }, [
  selStep('H2:H5', { text: 'Seleziona le celle <b>H2:H5</b> dove andranno i minigrafici.' }),

], { cells: [], cmds: ['spark'] });

L(5, 'Classifiche: RANGO.UG, GRANDE e PICCOLO', '<b>RANGO.UG</b> dà la posizione in classifica di un valore; <b>GRANDE(intervallo; k)</b> restituisce il k-esimo valore più alto, <b>PICCOLO</b> il k-esimo più basso. Perfette per podi e classifiche.',
  { title: 'Gara di corsa', data: Object.assign(grid([['Atleta', 'Tempo (minuti)', 'Posizione'], ['Aldo', '42,5', ''], ['Bice', '39,8', ''], ['Carlo', '45,1', ''], ['Dina', '38,9', ''], ['Enzo', '41,2', ''], ['Fede', '44', '']]), { E1: 'Miglior tempo', E2: 'Secondo tempo', E3: 'Tempo più lento' }), st: { 'A1:C1': HEAD, 'E1:E3': { b: 1 } }, colW: { B: 120, E: 120 } }, [
  { text: 'Vince il tempo più basso: in <b>C2</b> scrivi <code class="url">=RANGO.UG(B2;$B$2:$B$7;1)</code> e copia fino a <b>C7</b>.', path: ['cell:C2'], done: Q => rows(2, 7, r => Q.has('C' + r, 'RANGO.UG(B' + r)) && Q.v('C5') === 1 && Q.v('C4') === 6, wrong: Q => Q.v('C5') === 6 ? { title: 'Classifica al contrario', msg: 'Con 0 (o senza terzo argomento) il primo è il valore più alto. Per i tempi serve 1: =RANGO.UG(B2;$B$2:$B$7;<b>1</b>).' } : fWrong('C2')(Q), hints: ['Il terzo argomento 1 = ordine crescente (vince il più piccolo).'], solve: Q => { Q.set('C2', '=RANGO.UG(B2;$B$2:$B$7;1)'); fillTo('C2', 'C2:C7'); }, ok: 'Dina prima, Carlo ultimo.' },
  { text: 'In <b>F1</b> e <b>F2</b> i due migliori tempi con <b>PICCOLO</b> (k = 1 e 2), in <b>F3</b> il più lento con <b>GRANDE</b>.', path: ['cell:F1'], done: Q => Q.has('F1', 'PICCOLO(') && near(Q.v('F1'), 38.9) && Q.has('F2', 'PICCOLO(') && near(Q.v('F2'), 39.8) && Q.has('F3', 'GRANDE(') && near(Q.v('F3'), 45.1), hints: ['=PICCOLO(B2:B7;1), =PICCOLO(B2:B7;2), =GRANDE(B2:B7;1).'], solve: Q => { Q.set('F1', '=PICCOLO(B2:B7;1)'); Q.set('F2', '=PICCOLO(B2:B7;2)'); Q.set('F3', '=GRANDE(B2:B7;1)'); }, ok: 'Podio calcolato.' }
], { cells: ['C2:C7', 'F1:F3'], cmds: ['fill'] });

L(5, 'Esportare in CSV', 'Il formato <b>CSV</b> è un semplice testo con i valori separati: lo leggono gestionali, siti e altri programmi. Si crea da <b>File › Salva con nome</b> scegliendo il tipo <b>CSV</b>. Contiene solo i valori del foglio attivo, senza formule né formattazione.',
  { title: 'Contatti', data: grid([['Nome', 'Email', 'Telefono'], ['Anna Rossi', 'anna.rossi@example.com', '333 1112223'], ['Luca Neri', 'luca.neri@example.com', '347 4445556'], ['Sara Bini', 'sara.bini@example.com', '320 7778889']]), st: { 'A1:C1': HEAD }, colW: { A: 110, B: 190, C: 110 } }, [
  { text: 'File › <b>Salva con nome</b>.', path: ['tab:file', 'bs-saveas'], done: Q => !!$('#bsSaveAs') || !!C.flags.savedAs, hints: ['Scheda File, colonna a sinistra.'], solve: Q => openBackstage('saveas'), ok: 'Schermata Salva con nome.' },
  { text: 'Nome <b>Contatti per newsletter</b>, tipo <b>CSV UTF-8</b>, Salva.', path: ['bsName', 'bsFmt', 'bsSaveBtn'], done: Q => !!C.flags.savedAs && C.flags.savedAs.fmt === 'csv' && C.flags.savedAs.name === 'Contatti per newsletter', wrong: Q => { const f = C.flags.savedAs; if (f && f.fmt !== 'csv') return { title: 'Formato sbagliato', msg: 'Scegli il tipo <b>CSV UTF-8 (delimitato da separatore)</b>.' }; if (f && f.name !== 'Contatti per newsletter') return { title: 'Nome sbagliato', msg: `Hai salvato «${esc(f.name)}».` }; return null; }, hints: ['L\'elenco del tipo di file è sotto il nome.'], solve: Q => { if (!$('[data-id=bsName]')) openBackstage('saveas'); $('[data-id=bsName]').value = 'Contatti per newsletter'; $('[data-id=bsFmt]').value = 'csv'; $('[data-id=bsSaveBtn]').click(); }, ok: 'File CSV in Download, pronto da importare.' }
], { free: true });

const ORDF = [['Codice', 'Regione', 'Quantità', 'Prezzo', 'Totale'], ['P01', 'Nord', '40', '', ''], ['P04', 'Sud', '2', '', ''], ['P02', 'Centro', '150', '', ''], ['P05', 'Nord', '6', '', ''], ['P03', 'Sud', '200', '', ''], ['P01', 'Centro', '25', '', ''], ['P04', 'Nord', '3', '', ''], ['P02', 'Sud', '90', '', '']];
const TOT = r => ORDF.slice(1).filter(x => x[1] === r).reduce((s, x) => s + PRICE[x[0]] * +x[2], 0);
L(6, 'Progetto finale: il cruscotto delle vendite', 'Costruisci un piccolo <b>cruscotto</b> (dashboard) per il responsabile commerciale. Completa i <b>6 requisiti</b> nell\'ordine che preferisci.',
  { title: 'Cruscotto vendite', data: Object.assign(grid(ORDF), grid(LIST, 'J1'), grid([['Regione', 'Totale'], ['Nord', ''], ['Centro', ''], ['Sud', '']], 'G1')), st: { 'A1:E1': HEAD, 'G1:H1': HEAD, 'J1:L1': HEAD, 'D2:E9': { nf: 'eur', dec: 2 }, 'H2:H4': { nf: 'eur', dec: 2 }, 'L2:L6': { nf: 'eur', dec: 2 } }, colW: { K: 120 } }, [
  { text: 'In <b>D2:D9</b> il prezzo preso dal listino (J1:L6) con <b>CERCA.VERT</b> o <b>CERCA.X</b>.', done: Q => rows(2, 9, r => (Q.has('D' + r, 'CERCA.VERT(') || Q.has('D' + r, 'CERCA.X(')) && near(Q.v('D' + r), PRICE[Q.raw('A' + r)])), hints: ['=CERCA.VERT(A2;$J$2:$L$6;3;FALSO) e trascina.'], solve: Q => { Q.set('D2', '=CERCA.VERT(A2;$J$2:$L$6;3;FALSO)'); fillTo('D2', 'D2:D9'); } },
  { text: 'In <b>E2:E9</b> il totale riga (Quantità × Prezzo).', done: Q => rows(2, 9, r => Q.isF('E' + r) && near(Q.v('E' + r), Q.n('C' + r) * PRICE[Q.raw('A' + r)])), hints: ['=C2*D2 e trascina.'], solve: Q => { Q.set('E2', '=C2*D2'); fillTo('E2', 'E2:E9'); } },
  { text: 'In <b>H2:H4</b> il totale per regione con <b>SOMMA.SE</b>.', done: Q => ['Nord', 'Centro', 'Sud'].every((rg, i) => Q.has('H' + (i + 2), 'SOMMA.SE(') && near(Q.v('H' + (i + 2)), TOT(rg))), hints: ['=SOMMA.SE($B$2:$B$9;G2;$E$2:$E$9) e trascina.'], solve: Q => { Q.set('H2', '=SOMMA.SE($B$2:$B$9;G2;$E$2:$E$9)'); fillTo('H2', 'H2:H4'); } },
  { text: 'Un <b>istogramma</b> dei totali per regione (dati G1:H4).', done: Q => SH().charts.some(c => c.type === 'col' && c.range === 'G1:H4'), hints: ['Seleziona G1:H4 › Inserisci › Istogramma.'], solve: Q => { Q.select('G1:H4'); run('chart', 'col'); } },
  { text: 'Le colonne <b>E2:E9</b> hanno le <b>barre dei dati</b>.', done: Q => SH().cf.some(r => r.t === 'bar' && r.range === 'E2:E9'), hints: ['Formattazione condizionale › Barre dei dati.'], solve: Q => { Q.select('E2:E9'); run('cf', { t: 'bar', color: '#63c384' }); } },
  { text: 'La colonna <b>Regione B2:B9</b> accetta solo <b>Nord;Centro;Sud</b> (convalida Elenco).', done: Q => SH().valids.some(v => v.type === 'list' && v.range === 'B2:B9' && listItems(v).join('|').toLowerCase() === 'nord|centro|sud'), hints: ['Dati › Convalida dati › Elenco › Nord;Centro;Sud.'], solve: Q => { Q.select('B2:B9'); run('validation', { type: 'list', list: 'Nord;Centro;Sud' }); } }
], { order: 'any', free: true });
